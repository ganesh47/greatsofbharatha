name: GreatsOfBharatha
options:
  bundleIdPrefix: com.ganesh47
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_NAME: Greats Of Bharatha
    DEVELOPMENT_TEAM: "J3387FUR8X"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.3
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    GENERATE_INFOPLIST_FILE: YES
packages: {}
targets:
  GreatsOfBharatha:
    type: application
    platform: iOS
    sources:
      - path: GreatsOfBharatha
        excludes:
          - Features/Lesson/ShivajiLessonViews.swift
    resources:
      - path: GreatsOfBharatha/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.greatsofbharatha
        PRODUCT_NAME: Greats Of Bharatha
        INFOPLIST_KEY_CFBundleDisplayName: Greats Of Bharatha
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - GreatsOfBharathaTests
        - GreatsOfBharathaUITests
  GreatsOfBharathaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GreatsOfBharathaTests
    dependencies:
      - target: GreatsOfBharatha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.greatsofbharatha.tests
        PRODUCT_NAME: GreatsOfBharathaTests
        PRODUCT_MODULE_NAME: GreatsOfBharathaTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Greats Of Bharatha.app/Greats Of Bharatha"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GreatsOfBharathaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GreatsOfBharathaUITests
    dependencies:
      - target: GreatsOfBharatha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.greatsofbharatha.uitests
        PRODUCT_NAME: GreatsOfBharathaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GreatsOfBharatha
  GreatsOfBharathaTV:
    type: application
    platform: tvOS
    sources:
      - path: GreatsOfBharathaTV
        excludes:
          - Resources
      - path: GreatsOfBharatha/Shared
      - path: GreatsOfBharatha/DesignSystem/Tokens
      - path: GreatsOfBharatha/Features/LearnQuiz/LearnQuizPilotData.swift
      - path: GreatsOfBharatha/App/DebugNavigationRoute.swift
      - path: GreatsOfBharatha/Resources
        buildPhase: resources
      - path: GreatsOfBharathaTV/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.greatsofbharatha
        PRODUCT_NAME: Greats Of Bharatha TV
        PRODUCT_MODULE_NAME: GreatsOfBharathaTV
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_CFBundleDisplayName: Greats Of Bharatha
        ASSETCATALOG_COMPILER_APPICON_NAME: TVAppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    scheme:
      testTargets:
        - GreatsOfBharathaTVTests
        - GreatsOfBharathaTVUITests
  GreatsOfBharathaTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: GreatsOfBharathaTVTests
    dependencies:
      - target: GreatsOfBharathaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.greatsofbharatha.tv.tests
        PRODUCT_NAME: GreatsOfBharathaTVTests
        PRODUCT_MODULE_NAME: GreatsOfBharathaTVTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Greats Of Bharatha TV.app/Greats Of Bharatha TV"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GreatsOfBharathaTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: GreatsOfBharathaTVUITests
    dependencies:
      - target: GreatsOfBharathaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganesh47.greatsofbharatha.tv.uitests
        PRODUCT_NAME: GreatsOfBharathaTVUITests
        TEST_TARGET_NAME: GreatsOfBharathaTV
