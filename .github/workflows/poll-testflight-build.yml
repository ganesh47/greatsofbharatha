name: Poll TestFlight Build Status
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only discovery, repair existing Cloud archive, publish, or verify'
        type: choice
        options: [preflight, configure, publish, verify]
        default: preflight
      target_version:
        description: 'Numeric marketing version, for example 0.2.0'
        default: ''
      source_sha:
        description: 'Exact fully tested commit SHA'
        default: ''
      release_tag:
        description: 'Existing tag matching v plus target_version'
        default: ''
      cloud_workflow_id:
        description: 'Existing Xcode Cloud workflow ID from preflight'
        default: ''
      beta_group_id:
        description: 'Existing internal group ID from preflight'
        default: ''
      cloud_run_id:
        description: 'Cloud build run ID (required for verify)'
        default: ''
      build_number:
        description: 'CFBundleVersion / Cloud run number (required for verify)'
        default: ''

concurrency:
  group: testflight-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r ci_scripts/requirements-ci.txt
      - name: Xcode Cloud and TestFlight release
        env:
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          TARGET_VERSION: ${{ inputs.target_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CLOUD_WORKFLOW_ID: ${{ inputs.cloud_workflow_id }}
          BETA_GROUP_ID: ${{ inputs.beta_group_id }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_id }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 ci_scripts/testflight_release.py \
            --operation "$OPERATION" --version "$TARGET_VERSION" \
            --sha "$SOURCE_SHA" --tag "$RELEASE_TAG" \
            --workflow-id "$CLOUD_WORKFLOW_ID" --group-id "$BETA_GROUP_ID" \
            --cloud-run-id "$CLOUD_RUN_ID" --build-number "$BUILD_NUMBER"
      - name: Save sanitized release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testflight-evidence-${{ github.run_id }}
          path: release-evidence
          if-no-files-found: ignore
          retention-days: 30
